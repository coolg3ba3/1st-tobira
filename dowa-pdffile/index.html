<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>童謡 音読リーダー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Configure PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap');
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        /* Custom scrollbar for better touch experience */
        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 6px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none">

    <header class="bg-amber-500 text-white shadow-md p-4 text-center">
        <h1 class="text-3xl sm:text-4xl font-bold tracking-wider">🌸 音読ひろば（童謡） 🌸</h1>
        <p class="text-lg sm:text-xl mt-1 text-amber-100 font-medium">声をだして、楽しく音読しましょう</p>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto p-4 flex flex-col items-center">
        
        <!-- Status / Title Indicator -->
        <div class="w-full bg-white border-2 border-amber-300 rounded-2xl p-4 mb-4 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3 text-center sm:text-left">
                <span class="bg-amber-100 text-amber-800 px-4 py-2 rounded-xl text-xl font-bold" id="file-number-badge">ファイル: --</span>
                <span class="text-2xl font-bold text-slate-700" id="file-title">読み込み中...</span>
            </div>
            <div class="text-base text-slate-500 font-medium" id="page-indicator">ページ 1 / 1</div>
        </div>

        <!-- Big Touch-Friendly Controls Bar -->
        <div class="w-full grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
            <button onclick="zoomOut()" class="bg-white hover:bg-slate-50 active:bg-slate-100 border-3 border-slate-300 text-slate-700 text-xl font-bold py-4 px-6 rounded-2xl shadow-sm flex items-center justify-center gap-2 transition transform active:scale-95 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"/></svg>
                小さく
            </button>
            <button onclick="resetZoom()" class="bg-white hover:bg-slate-50 active:bg-slate-100 border-3 border-slate-300 text-slate-700 text-xl font-bold py-4 px-6 rounded-2xl shadow-sm flex items-center justify-center gap-2 transition transform active:scale-95 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                もどす
            </button>
            <button onclick="zoomIn()" class="bg-white hover:bg-slate-50 active:bg-slate-100 border-3 border-slate-300 text-slate-700 text-xl font-bold py-4 px-6 rounded-2xl shadow-sm flex items-center justify-center gap-2 transition transform active:scale-95 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                大きく
            </button>
            <button onclick="loadRandomPDF()" class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white text-2xl font-bold py-4 px-6 rounded-2xl shadow-md flex items-center justify-center gap-2 transition transform active:scale-95 cursor-pointer col-span-2 sm:col-span-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                次の童謡
            </button>
        </div>

        <!-- PDF Viewer Area -->
        <div id="viewer-container" class="w-full bg-white border-2 border-slate-200 rounded-2xl shadow-inner overflow-auto flex items-center justify-center p-4 min-h-[500px] relative">
            <div id="loading-spinner" class="absolute inset-0 flex flex-col items-center justify-center bg-white/80 z-10">
                <div class="animate-spin rounded-full h-16 w-16 border-4 border-amber-500 border-t-transparent mb-4"></div>
                <p class="text-xl font-bold text-slate-600">童謡をひらいています...</p>
            </div>
            <div id="error-message" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-white p-6 text-center z-20">
                <div class="text-red-500 text-6xl mb-3">⚠️</div>
                <h3 class="text-2xl font-bold text-slate-800 mb-2">ファイルが見つかりません</h3>
                <p class="text-lg text-slate-600 mb-4 max-w-md" id="error-detail">「story-pdf」フォルダの中にPDFファイル（02.pdf〜29.pdf）が正しく配置されているか確認してください。</p>
                <button onclick="loadRandomPDF()" class="bg-amber-500 text-white text-xl font-bold px-6 py-3 rounded-xl shadow hover:bg-amber-600 cursor-pointer">もういちど試す</button>
            </div>
            <canvas id="pdf-canvas" class="shadow-lg rounded"></canvas>
        </div>

    </main>

    <footer class="bg-slate-200 text-slate-600 py-4 text-center text-sm font-medium">
        ご高齢者のための音読サポートアプリ &copy; 2026
    </footer>

    <!-- Custom Modal for user alerts (No window.alert) -->
    <div id="custom-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl text-center border-4 border-amber-400">
            <h3 id="modal-title" class="text-2xl font-bold text-slate-800 mb-3">お知らせ</h3>
            <p id="modal-text" class="text-xl text-slate-600 mb-6 leading-relaxed">メッセージがここに入ります。</p>
            <button onclick="closeModal()" class="bg-amber-500 hover:bg-amber-600 text-white text-xl font-bold py-3 px-8 rounded-xl shadow cursor-pointer w-full">とじる</button>
        </div>
    </div>

    <script>
        // Configuration: Available PDF file range (02 to 29)
        const MIN_FILE_NUM = 2;
        const MAX_FILE_NUM = 29;

        let currentPdfDoc = null;
        let currentFileNum = null;
        let currentScale = 1.3; // Default scale optimized for seniors
        let isRendering = false;
        let pendingPageNum = null;

        // Custom notification dialog instead of alert()
        function showMessage(title, text) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-text').textContent = text;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        // Generate a random integer between min and max (inclusive)
        function getRandomFileNumber() {
            return Math.floor(Math.random() * (MAX_FILE_NUM - MIN_FILE_NUM + 1)) + MIN_FILE_NUM;
        }

        // Format file number with leading zero (e.g., 2 -> "02")
        function formatFileNum(num) {
            return String(num).padStart(2, '0');
        }

        // Load a random PDF from story-pdf folder
        function loadRandomPDF() {
            let nextNum;
            // Ensure we pick a different one if possible
            do {
                nextNum = getRandomFileNumber();
            } while (nextNum === currentFileNum && (MAX_FILE_NUM - MIN_FILE_NUM + 1) > 1);

            currentFileNum = nextNum;
            const fileStr = formatFileNum(currentFileNum);
            const pdfPath = `story-pdf/${fileStr}.pdf`;

            document.getElementById('file-number-badge').textContent = `No. ${fileStr}`;
            document.getElementById('file-title').textContent = `童謡 #${fileStr}`;
            document.getElementById('loading-spinner').classList.remove('hidden');
            document.getElementById('error-message').classList.add('hidden');

            // Load PDF document using PDF.js
            pdfjsLib.getDocument(pdfPath).promise.then(function(pdfDoc_) {
                currentPdfDoc = pdfDoc_;
                document.getElementById('page-indicator').textContent = `全 ${currentPdfDoc.numPages} ページ`;
                renderPage(1);
            }).catch(function(error) {
                console.error('Error loading PDF:', error);
                document.getElementById('loading-spinner').classList.add('hidden');
                document.getElementById('error-message').classList.remove('hidden');
                document.getElementById('error-detail').textContent = `「story-pdf/${fileStr}.pdf」が見つからないか、読み込めませんでした。`;
            });
        }

        // Render specific page onto canvas
        function renderPage(pageNum) {
            isRendering = true;
            currentPdfDoc.getPage(pageNum).then(function(page) {
                const canvas = document.getElementById('pdf-canvas');
                const ctx = canvas.getContext('2d');
                
                // Calculate scale based on container width and zoom level
                const container = document.getElementById('viewer-container');
                const unscaledViewport = page.getViewport({ scale: 1.0 });
                
                // Responsive fit width base
                const availableWidth = container.clientWidth - 40;
                const baseScale = availableWidth / unscaledViewport.width;
                const effectiveScale = Math.max(baseScale, 1.0) * currentScale;

                const viewport = page.getViewport({ scale: effectiveScale });

                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                const renderTask = page.render(renderContext);
                renderTask.promise.then(function() {
                    isRendering = false;
                    document.getElementById('loading-spinner').classList.add('hidden');
                    if (pendingPageNum !== null) {
                        renderPage(pendingPageNum);
                        pendingPageNum = null;
                    }
                });
            });
        }

        // Zoom controls
        function zoomIn() {
            currentScale = Math.min(currentScale + 0.25, 3.0);
            if (currentPdfDoc) {
                renderPage(1);
            }
        }

        function zoomOut() {
            currentScale = Math.max(currentScale - 0.25, 0.8);
            if (currentPdfDoc) {
                renderPage(1);
            }
        }

        function resetZoom() {
            currentScale = 1.3;
            if (currentPdfDoc) {
                renderPage(1);
            }
        }

        // Initialize on window load
        window.onload = function() {
            loadRandomPDF();
        };

        // Handle window resize for fluid responsiveness
        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                if (currentPdfDoc) {
                    renderPage(1);
                }
            }, 300);
        });
    </script>
</body>
</html>
